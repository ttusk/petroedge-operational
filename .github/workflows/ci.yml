name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Elixir quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.6"
          elixir-version: "1.20.4"
          version-type: strict

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.hex
            ~/.mix
          key: ${{ runner.os }}-beam-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run quality checks
        run: make ci

  compose:
    name: Docker Compose smoke test
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose --profile tools config --quiet

      - name: Build and start stack
        run: docker compose --profile tools up --build -d operational-postgres operational-migrate operational grpc-ui

      - name: Verify stack
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if docker compose --profile tools ps --status running --services | grep -qx operational \
              && curl --fail --silent "http://localhost:${GRPC_UI_PORT:-8080}/" >/dev/null \
              && docker compose --profile tools logs --no-color grpc-ui | grep -q "gRPC Web UI available"; then
              exit 0
            fi

            sleep 2
          done

          docker compose --profile tools ps -a
          docker compose --profile tools logs --no-color
          exit 1

      - name: Verify migration
        run: |
          table=$(docker compose exec -T operational-postgres \
            psql -U operational -d operational -tAc "select to_regclass('public.telemetry_events')")
          test "$(echo "$table" | tr -d '[:space:]')" = "telemetry_events"

      - name: Tear down stack
        if: always()
        run: docker compose --profile tools down -v --remove-orphans
